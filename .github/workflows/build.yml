name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: cargo test -p t405a-core --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libudev-dev

      - name: Build CLI and GUI
        run: cargo build --release --locked -p t405a-gsi -p t405a-gui

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/linux
          cp target/release/t405a-gsi dist/linux/
          cp target/release/t405a-gsi-gui dist/linux/
          tar -C dist/linux -czf "t405a-gsi-${{ matrix.name }}.tar.gz" .

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./build/macos-app.sh
          cd dist/macos
          zip -r "../../t405a-gsi-${{ matrix.name }}.zip" .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item target/release/t405a-gsi.exe dist/windows/
          Copy-Item target/release/t405a-gsi-gui.exe dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath "t405a-gsi-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: t405a-gsi-${{ matrix.name }}
          path: t405a-gsi-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine the release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            echo "using the pushed tag ${tag}"
          else
            existing=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
            if [ -n "${existing}" ]; then
              tag="${existing}"
              echo "HEAD is already tagged ${tag}; reusing it"
            else
              latest=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
              if [ -z "${latest}" ]; then
                tag="v0.1.0"
              else
                IFS=. read -r major minor patch <<< "${latest#v}"
                tag="v${major}.${minor}.$((patch + 1))"
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
                exists_at=$(git rev-list -n1 "${tag}")
                if [ "${exists_at}" != "$(git rev-parse HEAD)" ]; then
                  echo "tag ${tag} already points to ${exists_at}, not HEAD" >&2
                  exit 1
                fi
              else
                git tag -a "${tag}" -m "Release ${tag}"
                git push origin "refs/tags/${tag}"
              fi
            fi
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no build artifacts to attach" >&2
            exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${files[@]}" --clobber
          else
            gh release create "${tag}" "${files[@]}" --title "${tag}" --generate-notes
          fi
