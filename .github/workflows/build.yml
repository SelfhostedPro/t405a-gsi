name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: cargo test -p t405a-core --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libudev-dev

      - name: Build CLI and GUI
        run: cargo build --release --locked -p t405a-gsi -p t405a-gui

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/linux
          cp target/release/t405a-gsi dist/linux/
          cp target/release/t405a-gsi-gui dist/linux/
          tar -C dist/linux -czf "t405a-gsi-${{ matrix.name }}.tar.gz" .

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./build/macos-app.sh
          cd dist/macos
          zip -r "../../t405a-gsi-${{ matrix.name }}.zip" .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item target/release/t405a-gsi.exe dist/windows/
          Copy-Item target/release/t405a-gsi-gui.exe dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath "t405a-gsi-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: t405a-gsi-${{ matrix.name }}
          path: t405a-gsi-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
